<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korean to Nepali Word Meaning Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Learn Korean - Nepali</h1>
        </header>

        <div class="game-container">
            <h2>Level: <span id="level">Easy</span></h2>
            <div id="timer" class="timer">30s</div>

            <div id="korean-word" class="korean-word"></div>

            <div class="options">
                <button class="option-btn" data-answer="A">Option A</button>
                <button class="option-btn" data-answer="B">Option B</button>
                <button class="option-btn" data-answer="C">Option C</button>
                <button class="option-btn" data-answer="D">Option D</button>
            </div>

            <div id="result" class="result"></div>

            <button id="next-btn" class="next-btn" onclick="nextQuestion()">Next</button>
        </div>

        <footer>
            <div id="score">Score: 0</div>
            <div id="about">
                <p>Developer: Siddha Batala</p>
                <p>Email: <a href="mailto:sidbatala@gmail.com">sidbatala@gmail.com</a></p>
            </div>
            <button id="level-select-btn">Select Level</button>
            <div id="wrong-answers-list"></div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
